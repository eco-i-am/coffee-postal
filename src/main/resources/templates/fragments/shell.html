<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, active, body)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="${title} + ' - Coffee Postal'">Coffee Postal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/brand.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="42" height="46" viewBox="0 0 40 44" aria-hidden="true"><path d="M20 3C29 3 35 10 35 18C35 28 20 41 20 41C20 41 5 28 5 18C5 10 11 3 20 3Z" fill="#FE8282"/><ellipse cx="20" cy="15" rx="8" ry="6" fill="#FFC74A" transform="rotate(-25 20 15)"/><path d="M14 17c4-1 8-5 12-6" stroke="#FE8282" stroke-width="1.6" fill="none"/></svg>
      <div><b>Coffee<br>Postal</b><small>POS system</small></div>
    </div>
    <nav class="nav" aria-label="Main">
      <th:block th:each="n : ${nav}">
        <a th:if="${n.enabled}" th:href="@{${n.href}}" th:text="${n.label}"
           th:attr="aria-current=(${n.key == active} ? 'page' : null)">Item</a>
        <span th:unless="${n.enabled}" class="soon"><span th:text="${n.label}">Item</span><small>soon</small></span>
      </th:block>
    </nav>
    <div class="demo">
      <div class="who">Signed in as <b th:text="${who}">user</b></div>
      <form method="post" th:action="@{/logout}"><button class="out" type="submit">Sign out</button></form>
    </div>
  </aside>
  <main>
    <div class="top">
      <span class="where" th:text="${title}">Page</span><span class="sp"></span>
    </div>
    <div class="page">
      <th:block th:replace="${body}"></th:block>
    </div>
  </main>
</div>
</body>
</html>
