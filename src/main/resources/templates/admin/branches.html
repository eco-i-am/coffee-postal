<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: page('Branches', 'branches', ~{::section})}">
<body>
<section class="pg">
  <header><div><h1>Branches</h1><p>Create and manage every Coffee Postal branch.</p></div></header>
  <p th:if="${msg}" th:text="${msg}" role="status" class="notice"></p>

  <div class="two">
    <div class="sec">
      <h2>Add a branch</h2>
      <form method="post" th:action="@{/admin/branches}" th:object="${form}" class="stack" style="gap:12px">
        <div class="addr"><label for="code">Code</label><input id="code" th:field="*{code}" placeholder="CEB-03" required></div>
        <p class="err" th:if="${#fields.hasErrors('code')}" th:errors="*{code}" role="alert"></p>
        <div class="addr"><label for="name">Name</label><input id="name" th:field="*{name}" placeholder="Talisay" required></div>
        <p class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}" role="alert"></p>
        <div class="addr"><label for="address">Address</label><input id="address" th:field="*{address}"></div>
        <div class="addr"><label for="phone">Phone</label><input id="phone" th:field="*{phone}"></div>
        <button class="btn warm" type="submit">Add branch</button>
      </form>
    </div>

    <div class="sec tw">
      <h2>All branches</h2>
      <table>
        <thead><tr><th>Code</th><th>Name</th><th>Status</th><th></th></tr></thead>
        <tbody>
          <tr th:each="b : ${branches}">
            <td th:text="${b.code}">CEB-01</td>
            <td><b th:text="${b.name}">Cebu City</b></td>
            <td><span class="tag" th:classappend="${b.active} ? 'g' : 'r'" th:text="${b.active} ? 'Open' : 'Closed'">Open</span></td>
            <td>
              <form method="post" th:action="@{/admin/branches/{id}/toggle(id=${b.id})}">
                <button class="btn ghost sm" type="submit" th:text="${b.active} ? 'Close' : 'Reopen'">Close</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
