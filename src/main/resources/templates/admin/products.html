<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: page('Products', 'products', ~{::section})}">
<body>
<section class="pg">
  <header><div><h1>Products</h1><p>What every branch sells. Switch a product off and it leaves the POS.</p></div></header>
  <p th:if="${msg}" th:text="${msg}" role="status" class="notice"></p>

  <div class="two">
    <div class="sec">
      <h2>Add a product</h2>
      <form method="post" th:action="@{/admin/products}" th:object="${form}" class="stack" style="gap:12px">
        <div class="addr"><label for="name">Name</label><input id="name" th:field="*{name}" placeholder="Hazelnut Latte" required></div>
        <p class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}" role="alert"></p>
        <div class="addr"><label for="categoryId">Category</label>
          <select class="line" id="categoryId" th:field="*{categoryId}" required>
            <option value="">Choose a category</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Coffee</option>
          </select></div>
        <p class="err" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" role="alert"></p>
        <div class="opts">
          <div class="addr" style="flex:1;min-width:120px"><label for="price">Price (&#8369;)</label><input id="price" th:field="*{price}" inputmode="decimal" placeholder="99.00" required></div>
          <div class="addr" style="flex:1;min-width:120px"><label for="cost">Cost (&#8369;)</label><input id="cost" th:field="*{cost}" inputmode="decimal" placeholder="40.00"></div>
        </div>
        <p class="err" th:if="${#fields.hasErrors('price')}" th:errors="*{price}" role="alert"></p>
        <p class="err" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}" role="alert"></p>
        <div class="addr"><label for="art">Picture on the POS tile</label>
          <select class="line" id="art" th:field="*{art}">
            <option th:each="a : ${arts}" th:value="${a}" th:text="${a}">hot</option>
          </select></div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" th:field="*{hasSizes}" style="min-height:auto;width:20px;height:20px"> Offers Regular and Large (+&#8369;20)</label>
        <button class="btn warm" type="submit">Add product</button>
      </form>

      <h2 style="margin-top:24px">Add a category</h2>
      <form method="post" th:action="@{/admin/categories}" class="opts">
        <div class="addr" style="flex:1"><label for="catname">Name</label><input id="catname" name="name" placeholder="Pastries" required></div>
        <button class="btn ghost" type="submit" style="align-self:end">Add</button>
      </form>
    </div>

    <div class="sec tw">
      <h2>Menu</h2>
      <table>
        <thead><tr><th>Product</th><th>Category</th><th class="n">Price</th><th>Status</th><th></th></tr></thead>
        <tbody>
          <tr th:each="p : ${products}">
            <td><b th:text="${p.name}">Latte</b></td>
            <td th:text="${p.category}">Coffee</td>
            <td class="n" th:text="${'₱' + #numbers.formatDecimal(p.price / 100.0, 1, 'COMMA', 2, 'POINT')}">99.00</td>
            <td><span class="tag" th:classappend="${p.active} ? 'g' : 'r'" th:text="${p.active} ? 'On menu' : 'Off menu'">On menu</span></td>
            <td>
              <form method="post" th:action="@{/admin/products/{id}/toggle(id=${p.id})}">
                <button class="btn ghost sm" type="submit" th:text="${p.active} ? 'Switch off' : 'Switch on'">Switch off</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(products)}"><td colspan="5" style="text-align:center;color:var(--reseda);padding:24px">No products yet. Add the first one.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
