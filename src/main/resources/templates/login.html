<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in - Coffee Postal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/brand.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div id="login">
  <div class="postcard">
    <div class="pc-l">
      <div class="logo">
        <svg width="62" height="68" viewBox="0 0 40 44" aria-hidden="true"><path d="M20 3C29 3 35 10 35 18C35 28 20 41 20 41C20 41 5 28 5 18C5 10 11 3 20 3Z" fill="#FE8282"/><ellipse cx="20" cy="15" rx="8" ry="6" fill="#FFC74A" transform="rotate(-25 20 15)"/><path d="M14 17c4-1 8-5 12-6" stroke="#FE8282" stroke-width="1.6" fill="none"/></svg>
        <b><span>COFFEE</span><br><span>POSTAL</span></b>
      </div>
      <p>Your affordable freshly brewed coffee destination</p>
      <div th:replace="~{fragments/art :: loginart}"></div>
      <div class="mapcap">Most branches are in Cebu</div>
    </div>
    <form class="pc-r" method="post" th:action="@{/login}">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to start your shift.</p>
      <div class="addr"><label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus required></div>
      <div class="addr"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="err" role="alert" th:if="${param.error}">That username and password do not match. Try again.</p>
      <p class="err" role="status" th:if="${param.out}" style="color:var(--reseda)">You are signed out.</p>
      <button class="btn" style="width:100%" type="submit">Sign in</button>
      <div class="lgfoot"><span>Forgot your password? Ask HQ to reset it.</span></div>
    </form>
  </div>
</div>
</body>
</html>
