<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: page('Point of Sale', 'pos', ~{::section})}">
<body>
<section class="pg">
  <header>
    <div><h1>Point of Sale</h1><p>Tap an item to start an order. Prices include 12% VAT.</p></div>
  </header>
  <p id="posmsg" class="notice" role="alert" hidden></p>
  <div class="tabs" id="cats" role="group" aria-label="Categories"></div>
  <div class="pos">
    <div class="menu" id="menu"></div>
    <div class="cart" id="cart"></div>
  </div>
  <div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <script th:src="@{/js/pos.js}" defer></script>
</section>
</body>
</html>
