spring:
  application.name: coffee-postal-pos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coffeepostal}
    username: ${DB_USER:coffee}
    password: ${DB_PASSWORD:coffee}
    hikari.maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  thymeleaf.cache: ${THYMELEAF_CACHE:true}
  threads.virtual.enabled: true
server:
  error.include-message: always
  forward-headers-strategy: framework   # behind Caddy/Cloudflare
  servlet.session.cookie:
    secure: ${COOKIE_SECURE:true}
    http-only: true
    same-site: lax
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  timezone: Asia/Manila
  currency: PHP
