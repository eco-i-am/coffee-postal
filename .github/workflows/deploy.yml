name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: ./gradlew --no-daemon test   # Testcontainers uses the runner's Docker
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  deploy:
    needs: test
    concurrency: { group: deploy-prod, cancel-in-progress: false }   # one deploy at a time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64          # DigitalOcean Droplet (Singapore)
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }},ghcr.io/${{ github.repository }}-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64          # DigitalOcean Droplet (Singapore)
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }},ghcr.io/${{ github.repository }}-web:latest
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/coffee-postal/deploy
            docker compose --env-file ../.env -f compose.prod.yaml pull app web
            docker compose --env-file ../.env -f compose.prod.yaml up -d
            docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 https://system.coffeepostalph.com/actuator/health | grep -q '"status":"UP"'; then echo "site is UP"; exit 0; fi
            echo "waiting for the app ($i/24)"; sleep 10
          done
          echo "site did not come up healthy"; exit 1
